<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Leitor</title>

  <style>
    body {
      background: #0d0d0d;
      color: white;
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 { margin-top: 10px; }
    #contador { margin: 10px; color: #ccc; }

    .leitor-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 900px;
    }

    img {
      max-width: 90%;
      max-height: 75vh;
      border-radius: 10px;
    }

    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 40px;
      cursor: pointer;
      user-select: none;
      padding: 10px;
      background: rgba(0,0,0,0.5);
      border-radius: 50%;
      color: white;
    }

    .nav:hover { background: rgba(0,0,0,0.8); }

    .nav-esq { left: -50px; }
    .nav-dir { right: -50px; }

    .nav-cap {
      font-size: 22px;
      background: #222;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      margin: 5px;
      cursor: pointer;
    }

    .nav-cap:hover { background: #555; }

    .botoes {
      margin: 15px;
      max-width: 90%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      margin: 3px;
      padding: 6px 10px;
      cursor: pointer;
      background: #222;
      color: white;
      border: none;
      border-radius: 5px;
    }

    button.ativo {
      background: #00bfff;
      color: black;
      font-weight: bold;
    }

    button:hover { background: #555; }
  </style>
</head>

<body>

<h1 id="titulo">Minha HQ</h1>
<div id="contador"></div>

<div class="leitor-container">
  <span class="nav nav-esq" onclick="anterior()">⬅️</span>
  <img id="pagina">
  <span class="nav nav-dir" onclick="proxima()">➡️</span>
</div>

<div>
  <span class="nav-cap" onclick="capAnterior()">« Capítulo</span>
  <span class="nav-cap" onclick="capProximo()">Capítulo »</span>
</div>

<div class="botoes" id="botoes"></div>

  };

  const totalCapitulos = Object.keys(paginasPorCap).length;
  let paginaAtual = 0;

  const img = document.getElementById("pagina");
  const contador = document.getElementById("contador");
  const botoesDiv = document.getElementById("botoes");

  function atualizar() {
    img.src = `img/cap${capitulo}/` + paginasPorCap[capitulo][paginaAtual];
    contador.innerText = `Capítulo ${capitulo} | Página ${paginaAtual + 1} / ${paginasPorCap[capitulo].length}`;
    document.querySelectorAll("button").forEach(btn => btn.classList.remove("ativo"));
    document.getElementById("btn-" + paginaAtual)?.classList.add("ativo");
  }

  function proxima() {
    if (paginaAtual < paginasPorCap[capitulo].length - 1) {
      paginaAtual++;
    } else if (capitulo < totalCapitulos) {
      capitulo++; paginaAtual = 0; criarBotoes();
    }
    atualizar();
  }

  function anterior() {
    if (paginaAtual > 0) {
      paginaAtual--;
    } else if (capitulo > 1) {
      capitulo--; paginaAtual = paginasPorCap[capitulo].length - 1; criarBotoes();
    }
    atualizar();
  }

  function capProximo() { if (capitulo < totalCapitulos) { capitulo++; paginaAtual=0; criarBotoes(); atualizar(); } }
  function capAnterior() { if (capitulo > 1) { capitulo--; paginaAtual=0; criarBotoes(); atualizar(); } }

  function criarBotoes() {
    botoesDiv.innerHTML = "";
    paginasPorCap[capitulo].forEach((p, i) => {
      const btn = document.createElement("button");
      btn.innerText = i + 1;
      btn.id = "btn-" + i;
      btn.onclick = () => { paginaAtual = i; atualizar(); };
      botoesDiv.appendChild(btn);
    });
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") proxima();
    if (e.key === "ArrowLeft") anterior();
    if (e.key === "PageDown") capProximo();
    if (e.key === "PageUp") capAnterior();
  });

  criarBotoes();
  atualizar();

</script>

</html>
